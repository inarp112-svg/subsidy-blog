name: Daily Subsidy Auto Post

on:
  schedule:
    - cron: '0 21 * * *' # 매일 KST 06:00 실행
  workflow_dispatch:     # 수동 테스트 실행 버튼 활성화

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-genai

      - name: Run auto_post script
        env:
          GOV24_API_KEY: ${{ secrets.GOV24_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/auto_post.py

      - name: Commit and push new posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/ data/posted_ids.json
          git diff --staged --quiet || git commit -m "feat: add daily subsidy posts"
          git push
