<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }} | 놓치기 쉬운 정부·지자체 혜택 정리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --primary: #1a56db;
      --primary-bg: #eff6ff;
      --text-main: #111827;
      --text-sub: #4b5563;
      --text-muted: #6b7280;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
    }
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .brand span { color: var(--primary); }
    nav a {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      margin-left: 20px;
    }
    nav a:hover { color: var(--primary); }
    .hero {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 36px 20px;
    }
    .hero-inner {
      max-width: 900px;
      margin: 0 auto;
    }
    .hero h1 {
      margin: 0 0 8px 0;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .hero p {
      margin: 0;
      color: var(--text-sub);
      font-size: 1rem;
    }
    main {
      max-width: 900px;
      margin: 32px auto 60px;
      padding: 0 20px;
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 16px;
    }
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 24px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .post-card:hover {
      transform: translateY(-2px);
      border-color: #bfdbfe;
      box-shadow: 0 6px 16px rgba(17, 24, 39, 0.06);
    }
    .post-card a {
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.82rem;
    }
    .badge {
      background: var(--primary-bg);
      color: var(--primary);
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
    }
    .date { color: var(--text-muted); }
    .post-title {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.45;
      letter-spacing: -0.01em;
    }
    .post-card:hover .post-title { color: var(--primary); }
    footer {
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      padding: 28px 20px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }
    .footer-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-links a {
      color: var(--text-sub);
      text-decoration: none;
      margin-right: 18px;
    }
    .footer-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/">매일 <span>정부지원금</span> 요약</a>
      <nav>
        <a href="/about/">소개 및 문의</a>
        <a href="/privacy/">개인정보처리방침</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1>오늘 확인해야 할 정부·지자체 지원금</h1>
      <p>보조금24 공식 데이터를 바탕으로 자격 조건과 신청 방법을 핵심만 정리해 드립니다.</p>
    </div>
  </section>

  <main>
    <div class="section-title">최신 지원금 안내</div>
    <ul class="post-list">
      {{ range where .Site.RegularPages "Section" "posts" }}
      <li class="post-card">
        <a href="{{ .RelPermalink }}">
          <div class="post-meta">
            <span class="badge">정부지원금</span>
            <span class="date">{{ .Date.Format "2006.01.02" }}</span>
          </div>
          <h2 class="post-title">{{ .Title }}</h2>
        </a>
      </li>
      {{ end }}
    </ul>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-links">
        <a href="/about/">소개 및 문의</a>
        <a href="/privacy/">개인정보처리방침</a>
      </div>
      <div>데이터 출처: 행정안전부 보조금24 공공데이터</div>
    </div>
  </footer>
</body>
</html>
