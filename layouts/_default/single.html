<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --primary: #1a56db;
      --primary-bg: #eff6ff;
      --text-main: #111827;
      --text-body: #1f2937;
      --text-sub: #4b5563;
      --text-muted: #6b7280;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-body);
      line-height: 1.8;
    }
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
    }
    .brand span { color: var(--primary); }
    .back-link {
      font-size: 0.9rem;
      color: var(--text-sub);
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover { color: var(--primary); }
    main {
      max-width: 820px;
      margin: 32px auto 64px;
      padding: 0 20px;
    }
    .article-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 44px;
    }
    @media (max-width: 640px) {
      .article-box { padding: 26px 20px; }
    }
    .article-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 22px;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-block;
      background: var(--primary-bg);
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.4;
      letter-spacing: -0.02em;
    }
    .meta-date {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    article h2 {
      font-size: 1.28rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 36px 0 14px;
      padding-left: 12px;
      border-left: 4px solid var(--primary);
      line-height: 1.4;
    }
    article h3 {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 24px 0 10px;
    }
    article p { margin: 0 0 16px; }
    article ul, article ol {
      margin: 0 0 20px;
      padding-left: 22px;
    }
    article li { margin-bottom: 8px; }
    article hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }
    article table {
      width: 100%;
      border-collapse: collapse;
      margin: 22px 0;
      font-size: 0.94rem;
    }
    article th, article td {
      border: 1px solid var(--border);
      padding: 12px 14px;
      text-align: left;
      vertical-align: top;
    }
    article th {
      background: #f9fafb;
      font-weight: 700;
      color: var(--text-main);
      width: 24%;
    }
    article a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    article blockquote {
      margin: 22px 0;
      padding: 16px 20px;
      background: #f8fafc;
      border-left: 4px solid #94a3b8;
      color: var(--text-sub);
      border-radius: 0 8px 8px 0;
    }
    footer {
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      padding: 24px 20px;
      color: var(--text-muted);
      font-size: 0.88rem;
      text-align: center;
    }
    footer a {
      color: var(--text-sub);
      text-decoration: none;
      margin: 0 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/">매일 <span>정부지원금</span> 요약</a>
      <a class="back-link" href="/">← 전체 목록</a>
    </div>
  </header>

  <main>
    <div class="article-box">
      <div class="article-header">
        {{ if eq .Section "posts" }}<span class="badge">정부지원금</span>{{ end }}
        <h1>{{ .Title }}</h1>
        {{ if not .Date.IsZero }}
        <div class="meta-date">작성일 {{ .Date.Format "2006.01.02" }}</div>
        {{ end }}
      </div>
      <article>{{ .Content }}</article>
    </div>
  </main>

  <footer>
    <a href="/about/">소개 및 문의</a>
    <a href="/privacy/">개인정보처리방침</a>
  </footer>
</body>
</html>
