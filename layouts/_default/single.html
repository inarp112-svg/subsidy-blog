<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font-family: -apple-system, sans-serif; line-height: 1.8; color: #222; }
    .back { display: inline-block; margin-bottom: 20px; color: #555; text-decoration: none; }
    h1 { line-height: 1.4; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f8f9fa; }
  </style>
</head>
<body>
  <a class="back" href="/">← 목록으로 돌아가기</a>
  <h1>{{ .Title }}</h1>
  <article>{{ .Content }}</article>
</body>
</html>
